<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyclewise — Manual Finance</title>

<!-- Roboto Flex: the M3 variable font. Full axes for expressive weight/width/optical-size control. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ═══════════════════════════════════════════════════════════════
   Cyclewise — M3 Expressive surface
   All colour resolves through CSS custom properties set by
   buildRoles() (tokens.jsx) on .app-root. No raw palette here.
   ═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

body {
  font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background:
    radial-gradient(120% 120% at 50% 0%, #f3f2f0 0%, #e6e4e1 60%, #dedcd8 100%);
  color: #1a1a1a;
}

/* ── page shell: neutral stage holding the device + variant switcher ── */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px 16px 28px;
}

/* variant switcher — outside the scaled frame, always reachable */
.switcher {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(255,255,255,.7);
  border: .5px solid rgba(0,0,0,.07);
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  backdrop-filter: blur(8px);
}
.sw-btn {
  appearance: none;
  border: 0;
  background: transparent;
  font: inherit;
  font-size: 13px;
  font-weight: 560;
  letter-spacing: .01em;
  color: #6a6862;
  padding: 8px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: color .18s ease, background .18s ease;
}
.sw-btn:hover { color: #2a2824; }
.sw-btn[data-on] {
  background: #1f1d1a;
  color: #fafafa;
  box-shadow: 0 1px 2px rgba(0,0,0,.18);
}

/* ── the app surface inside the device ── */
.app-root {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.scroll-region {
  --kv: 0;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-region::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════════════════════════════
   TYPE SCALE — M3E baseline + Emphasized (.emph) variants
   Emphasized = heavier weight + slightly expanded width.
   ═══════════════════════════════════════════════════════════════ */
.t-label-s  { font-size: 11px;  font-weight: 560; line-height: 1.3; }
.t-label-m  { font-size: 12.5px; font-weight: 560; line-height: 1.3; }
.t-body-l   { font-size: 16.5px; font-weight: 400; line-height: 1.38; letter-spacing: -.003em; }
.t-title-l  { font-size: 21px;  font-weight: 520; line-height: 1.18; letter-spacing: -.01em; }
.t-headline-s { font-size: 25px; font-weight: 520; line-height: 1.12; letter-spacing: -.015em; }

.emph {
  font-weight: 800;
  font-variation-settings: 'wght' 760, 'wdth' 105, 'opsz' 40;
  letter-spacing: -.012em;
}

/* tabular figures everywhere money is shown */
.t-title-l, .t-headline-s, .ed-num, .g-num, .ch-num, .amt { font-variant-numeric: tabular-nums; }

/* ── dashboard header ── */
.dash-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 60px 24px 12px;
}

/* ── M3 segmented control ── */
.m3-seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  background: var(--sc);
  border: .5px solid var(--outline-faint);
}
.m3-seg[data-small] { padding: 2px; }
.m3-seg-btn {
  appearance: none;
  border: 0;
  background: transparent;
  font: inherit;
  font-size: 13px;
  font-weight: 560;
  color: var(--on-variant);
  padding: 7px 15px;
  border-radius: 999px;
  cursor: pointer;
  transition: color .2s ease, background .25s cubic-bezier(.34,1.2,.5,1);
}
.m3-seg[data-small] .m3-seg-btn { padding: 6px 13px; font-size: 12px; }
.m3-seg-btn[data-on] {
  background: var(--primary);
  color: var(--on-primary);
}

/* ── round icon button ── */
.m3-iconbtn {
  appearance: none;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border: .5px solid var(--outline-faint);
  border-radius: 999px;
  background: var(--sc);
  color: var(--on-surface);
  cursor: pointer;
  transition: background .2s ease, transform .15s ease;
}
.m3-iconbtn:hover { background: var(--sc-high); }
.m3-iconbtn:active { transform: scale(.92); }

/* ── cycle progress bar ── */
.scroll-pad { padding: 0; }
.cyc-track {
  height: 7px;
  border-radius: 999px;
  background: var(--sc-high);
  overflow: hidden;
}
.cyc-fill {
  height: 100%;
  border-radius: 999px;
  transition: width .7s cubic-bezier(.34,1.1,.5,1);
}

/* ═══════════════════════════════════════════════════════════════
   A · EDITORIAL — typography does the work
   ═══════════════════════════════════════════════════════════════ */
.ed-hero { padding: 18px 24px 6px; }
.ed-num {
  font-size: 88px;
  line-height: .92;
  font-weight: 800;
  font-variation-settings: 'wght' 830, 'wdth' 125, 'opsz' 144;
  letter-spacing: -.045em;
  margin: 6px 0 10px;
}
.ed-cur { font-size: .42em; font-weight: 700; vertical-align: .62em; margin-right: .04em; opacity: .8; }
.ed-frac { font-size: .42em; font-weight: 700; opacity: .55; }
.ed-sub {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 6px 24px 20px;
  margin-top: 6px;
  border-top: 1.5px solid var(--outline-faint);
}
.ed-sub > div > div:first-child { margin-bottom: 4px; }

/* ═══════════════════════════════════════════════════════════════
   B · GAUGE — ring with signature geometry container
   ═══════════════════════════════════════════════════════════════ */
.gauge-card {
  position: relative;
  margin: 14px 20px 8px;
  padding: 26px 22px 22px;
  background: var(--sc);
  border-radius: 40px 40px 40px 16px;   /* organic asymmetric silhouette */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  transition: border-radius .55s cubic-bezier(.5,1.3,.5,1);
}
.gauge-card.sharp { border-radius: 16px; }  /* shape-morph on tight state */
.g-num {
  font-size: 52px;
  line-height: 1;
  font-weight: 800;
  font-variation-settings: 'wght' 820, 'wdth' 120, 'opsz' 90;
  letter-spacing: -.03em;
  margin: 6px 0 4px;
}
.g-legend {
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: 100%;
  padding: 4px 6px 0;
}
.g-leg-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.g-leg-item > span:nth-child(2) { flex: 1; }

/* ═══════════════════════════════════════════════════════════════
   C · CARDS — filled hero + bucket stat cards
   ═══════════════════════════════════════════════════════════════ */
.cards-hero {
  position: relative;
  margin: 14px 20px 14px;
  padding: 24px 24px 20px;
  background: var(--primary-container);
  border-radius: 36px 36px 36px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-radius .55s cubic-bezier(.5,1.3,.5,1);
}
.cards-hero.sharp { border-radius: 14px; }
.ch-num {
  font-size: 60px;
  line-height: .96;
  font-weight: 800;
  font-variation-settings: 'wght' 830, 'wdth' 122, 'opsz' 110;
  letter-spacing: -.04em;
  margin: 2px 0 4px;
}
.bk-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  padding: 0 20px 6px;
}
.bk-card {
  background: var(--sc);
  border-radius: 22px;
  padding: 14px 13px 15px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.bk-track {
  height: 5px;
  border-radius: 999px;
  background: var(--sc-high);
  overflow: hidden;
}
.bk-fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.34,1.1,.5,1); }

/* ═══════════════════════════════════════════════════════════════
   TIMELINE — typographic dividers + soft-edged rows
   ═══════════════════════════════════════════════════════════════ */
.timeline { padding: 4px 20px 0; }
.tl-group { margin-bottom: 6px; }
.tl-divider {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 4px 8px;
}
.tl-divider > span { white-space: nowrap; }
.tl-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  border-radius: 20px;
  background: var(--sc-low);
  margin-bottom: 7px;
  transition: transform .12s ease-out, box-shadow .4s ease;
  transform: translateY(calc(var(--kv, 0) * -5px));  /* kinetic weight */
}
.tl-new {
  animation: tlpop .7s cubic-bezier(.34,1.4,.5,1) both;
  box-shadow: 0 0 0 2px var(--primary);
}
@keyframes tlpop {
  0%   { transform: scale(.94); opacity: 0; }
  60%  { transform: scale(1.02); }
  100% { transform: scale(1); opacity: 1; }
}

/* ═══════════════════════════════════════════════════════════════
   ADD FLOW — FAB ⇄ sheet spring morph
   ═══════════════════════════════════════════════════════════════ */
.scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity .42s ease;
  z-index: 40;
}
.scrim[data-on] { opacity: 1; pointer-events: auto; }

.morph {
  position: absolute;
  right: 20px;
  z-index: 45;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.14);
  transition:
    width   .52s cubic-bezier(.5,1.25,.45,1),
    height  .52s cubic-bezier(.5,1.25,.45,1),
    bottom  .52s cubic-bezier(.5,1.25,.45,1),
    right   .52s cubic-bezier(.5,1.25,.45,1),
    border-radius .52s cubic-bezier(.5,1.25,.45,1),
    background .3s ease;
  cursor: pointer;
}
.morph[data-open] { right: 0; cursor: default; }
.morph[data-rm] { transition: background .3s ease; }   /* reduced motion: no geometry tween */

.fab-face {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 1;
  transition: opacity .18s ease .12s;
}
.fab-face[data-hide] { opacity: 0; transition: opacity .12s ease; pointer-events: none; }

.sheet-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 0 22px 22px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity .22s ease, transform .3s ease;
}
.sheet-face[data-show] {
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition: opacity .28s ease .16s, transform .42s cubic-bezier(.34,1.2,.5,1) .12s;
}

.sheet-grip {
  width: 38px; height: 5px; border-radius: 999px;
  background: var(--outline);
  opacity: .5;
  margin: 12px auto 8px;
  flex-shrink: 0;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 2px 14px;
  flex-shrink: 0;
}

.amount-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  padding: 6px 0 14px;
  flex-shrink: 0;
}
.amt {
  font-size: 60px;
  font-weight: 800;
  font-variation-settings: 'wght' 820, 'wdth' 120, 'opsz' 110;
  letter-spacing: -.04em;
  line-height: 1;
  transition: color .25s ease;
}
.amt-cur { font-size: .44em; font-weight: 700; vertical-align: .58em; margin-right: .03em; opacity: .7; }

.note-input {
  appearance: none;
  width: 100%;
  border: 0;
  background: var(--sc);
  border-radius: 16px;
  padding: 14px 16px;
  font: inherit;
  font-size: 15px;
  color: var(--on-surface);
  outline: none;
  margin-bottom: 14px;
  flex-shrink: 0;
  border: 1.5px solid transparent;
  transition: border-color .2s ease, background .3s ease;
}
.note-input::placeholder { color: var(--on-variant); opacity: .8; }
.note-input:focus { border-color: var(--bk); }

.bucket-row {
  display: flex;
  gap: 9px;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.bucket-btn {
  appearance: none;
  flex: 1;
  border: 1.5px solid var(--outline-faint);
  background: transparent;
  border-radius: 16px;
  padding: 13px 6px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--on-variant);
  cursor: pointer;
  transition: all .26s cubic-bezier(.34,1.2,.5,1);
}
.bucket-btn[data-on] {
  background: var(--soft);
  border-color: var(--c);
  color: var(--c);
  font-weight: 720;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px color-mix(in oklch, var(--c) 28%, transparent);
}

/* ── keypad ── */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  flex: 1;
  min-height: 0;
  margin-bottom: 14px;
}
.kp-key {
  appearance: none;
  border: 0;
  background: var(--sc);
  border-radius: 18px;
  font: inherit;
  font-size: 25px;
  font-weight: 560;
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .14s ease, transform .1s ease;
}
.kp-key:hover { background: var(--sc-high); }
.kp-key:active { background: var(--sc-highest); transform: scale(.95); }
.kp-key[data-action] { background: transparent; color: var(--on-variant); }

.commit-btn {
  appearance: none;
  border: 0;
  border-radius: 20px;
  height: 58px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  font: inherit;
  font-size: 16px;
  font-weight: 680;
  cursor: pointer;
  transition: background .3s ease, color .3s ease, transform .12s ease, opacity .2s ease;
}
.commit-btn:not([data-valid]) { cursor: not-allowed; opacity: .85; }
.commit-btn[data-valid]:active { transform: scale(.98); }

/* ── tweaks: seed swatches ── */
.seed-row { display: flex; gap: 8px; }
.seed-sw {
  appearance: none;
  flex: 1;
  height: 30px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.15);
  transition: transform .12s ease, box-shadow .12s ease;
}
.seed-sw:hover { transform: translateY(-1px); }
.seed-sw[data-on] { box-shadow: 0 0 0 2px #1f1d1a, 0 2px 6px rgba(0,0,0,.2); }

/* ── allocation bar — the "balanced view" of income ── */
.alloc-bar {
  display: flex;
  width: 100%;
  border-radius: 999px;
  overflow: hidden;
  background: var(--sc-high);
}
.alloc-seg {
  height: 100%;
  box-shadow: inset -1.5px 0 0 var(--surface);
  transition: width .6s cubic-bezier(.34,1.1,.5,1), background .3s ease;
}
.alloc-rest { height: 100%; background: transparent; }

/* ── entry mode toggle: Spend / Set aside ── */
.mode-seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--sc);
  border-radius: 16px;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.mode-btn {
  appearance: none;
  flex: 1;
  border: 0;
  background: transparent;
  font: inherit;
  font-size: 14.5px;
  font-weight: 620;
  color: var(--on-variant);
  padding: 11px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .26s cubic-bezier(.34,1.2,.5,1), color .2s ease;
}
.mode-btn[data-on] {
  background: var(--sc-highest);
  color: var(--on-surface);
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}

/* ── closed-cycle outcome chip ── */
.outcome {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0 24px 14px;
  padding: 14px 18px;
  border-radius: 22px;
  background: var(--status-container);
  color: var(--status);
}
.outcome[data-pos] { background: var(--primary-container); color: var(--on-primary-container); }

/* waterfall result rows get a top rule to read as a sum */
.set-group > .set-row.wf-divider { border-top: 1.5px solid var(--outline-faint); }
.cyc-summary.cyc-closed { border-radius: 26px; background: var(--status-container); padding: 16px 18px; }
.cyc-summary.cyc-closed[data-pos] { background: var(--primary-container); }

/* ── full-spectrum hue slider ── */
.hue-slider {
  position: relative;
  height: 38px;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.hue-track {
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 14px;
  transform: translateY(-50%);
  border-radius: 999px;
  background: linear-gradient(to right,
    oklch(0.65 0.15 0),   oklch(0.65 0.15 30),  oklch(0.65 0.15 60),
    oklch(0.65 0.15 90),  oklch(0.65 0.15 120), oklch(0.65 0.15 150),
    oklch(0.65 0.15 180), oklch(0.65 0.15 210), oklch(0.65 0.15 240),
    oklch(0.65 0.15 270), oklch(0.65 0.15 300), oklch(0.65 0.15 330),
    oklch(0.65 0.15 360));
}
.hue-thumb {
  position: absolute;
  top: 50%;
  width: 28px; height: 28px;
  border-radius: 999px;
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.08);
  transform: translate(-50%, -50%);
  transition: box-shadow .15s ease;
  pointer-events: none;
}
.hue-slider:active .hue-thumb {
  box-shadow: 0 2px 8px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.1);
  width: 32px; height: 32px;
}
.hue-preview {
  width: 24px; height: 24px;
  border-radius: 999px;
  flex-shrink: 0;
  box-shadow: 0 0 0 1.5px rgba(0,0,0,.12);
}

/* ── custom category text input (below chips in entry) ── */
.custom-cat-input {
  appearance: none;
  width: 100%;
  border: 1.5px solid var(--outline-faint);
  background: transparent;
  border-radius: 14px;
  padding: 11px 14px;
  font: inherit;
  font-size: 14px;
  font-weight: 520;
  color: var(--on-surface);
  outline: none;
  margin-bottom: 12px;
  flex-shrink: 0;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.custom-cat-input::placeholder { color: var(--on-variant); opacity: .65; font-weight: 400; }
.custom-cat-input:focus { border-color: var(--primary); }

@media (prefers-reduced-motion: reduce) {
  .tl-new { animation: none; }
  .tl-row { transform: none; }
}

/* ═══════════════════════════════════════════════════════════════
   PUSH SCREENS — settings & cycle detail slide in from the right
   ═══════════════════════════════════════════════════════════════ */
.screen {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: var(--surface);
  color: var(--on-surface);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .44s cubic-bezier(.36,1.05,.42,1);
  will-change: transform;
}
.screen[data-open] { transform: none; }
.screen-rm { transition: none; }
.screen-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 58px 18px 12px;
  flex-shrink: 0;
}
.screen-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 20px 44px;
  scrollbar-width: none;
}
.screen-body::-webkit-scrollbar { display: none; }

/* section label + grouped rows */
.set-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--on-variant);
  padding: 14px 8px 9px;
}
.set-group {
  background: var(--sc);
  border-radius: 26px;
  overflow: hidden;
}
.set-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-bottom: .5px solid var(--outline-faint);
}
.set-group > .set-row:last-child { border-bottom: 0; }
.set-row[data-tappable] { cursor: pointer; transition: background .15s ease; }
.set-row[data-tappable]:active { background: var(--sc-high); }

/* settings account header */
.set-account {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 8px 6px 20px;
}
.set-avatar {
  width: 58px; height: 58px;
  border-radius: 999px;
  background: var(--primary);
  color: var(--on-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 25px; font-weight: 800;
  font-variation-settings: 'wght' 780, 'wdth' 110;
  flex-shrink: 0;
}

/* M3 switch */
.m3-switch {
  appearance: none;
  width: 50px; height: 30px;
  border-radius: 999px;
  border: 2px solid var(--outline);
  background: transparent;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s ease, border-color .25s ease;
}
.m3-switch-knob {
  position: absolute;
  top: 50%; left: 5px;
  width: 14px; height: 14px;
  border-radius: 999px;
  background: var(--outline);
  transform: translate(0, -50%);
  transition: transform .28s cubic-bezier(.34,1.4,.5,1), width .2s ease, height .2s ease, background .25s ease, left .2s ease;
}
.m3-switch[data-on] {
  background: var(--primary);
  border-color: var(--primary);
}
.m3-switch[data-on] .m3-switch-knob {
  width: 22px; height: 22px;
  left: 4px;
  background: var(--on-primary);
  transform: translate(18px, -50%);
}

/* cycle screen summary + bucket rows */
.cyc-summary {
  padding: 6px 8px 18px;
}
.cyc-bucket {
  padding: 12px 18px;
}

/* hero tap affordance — chevron cue on tappable hero cards */
.hero-tap { cursor: pointer; }
.hero-chev {
  position: absolute;
  top: 16px; right: 18px;
  display: flex;
  opacity: .55;
  transition: transform .2s ease, opacity .2s ease;
}
.hero-tap:active .hero-chev { transform: translateX(2px); opacity: .9; }
.ed-hero { position: relative; }
</style>
