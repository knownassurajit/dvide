name: CI / CD

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
# develop -> master pipeline:
#   - push to develop / master and every PR into master run the test job
#   - push to develop additionally cuts a debug pre-release
#   - PRs into master get a detailed summary + sticky PR comment
#   - push to master is the SINGLE release trigger (no separate tag trigger,
#     avoids double-firing GitHub Releases for the same commit)
#   - that master push builds a signed release AAB and uploads it to the Play
#     internal track when the existing signing secrets and PLAY_CONSOLE_JSON
#     are all set. Missing Play credentials skip the upload; they do not fail
#     the job.
on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# ──────────────────────────────────────────────────────────────────────────────
# Global environment
# ──────────────────────────────────────────────────────────────────────────────
env:
  JAVA_VERSION:   '17'
  JAVA_DISTRO:    temurin
  APK_DEBUG:      dvide-debug.apk
  APK_RELEASE:    dvide-release.apk
  AAB_RELEASE:    dvide-release.aab
  # Must match applicationId in app/build.gradle.kts. The stable-release job
  # reads the Gradle value and fails if it drifts from this package name.
  PLAY_PACKAGE_NAME: com.knownassurajit.dvide_finance.app
  PLAY_TRACK: internal

permissions: read-all

jobs:

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  1 · TEST                                                                │
  # │  Compile → unit tests → lint. Runs on every push to develop/master and  │
  # │  every PR into master. Fully containerized.                             │
  # └─────────────────────────────────────────────────────────────────────────┘
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17-jdk-jammy
    timeout-minutes: 30

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip curl git ca-certificates

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check Play credential gating
        run: sh .github/scripts/resolve-release-secrets.test.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # The legacy `tools` package is gone and fails sdkmanager. Install the
          # API 36 platform this app compiles against, plus build-tools.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Validate Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Set up Gradle (cache + build-scan)
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile debug sources (no tests)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint (debug variant)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload lint XML results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint-results-xml
          path: app/build/reports/lint-results-debug.xml
          retention-days: 7

      - name: Annotate PR with test failures
        if: failure() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          check_name: Unit Test Results

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  2 · DEBUG PRE-RELEASE                                                   │
  # │  Push to develop only. Builds a debug APK and publishes it as a         │
  # │  GitHub pre-release so testers can install straight from develop.       │
  # └─────────────────────────────────────────────────────────────────────────┘
  debug-release:
    name: Debug Pre-release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17-jdk-jammy
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip curl git ca-certificates

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # checkout is a JavaScript action and runs on the host. Shell steps run
      # as root inside the job container, so git refuses the host-owned repo
      # until this config is set inside the container.
      - name: Trust git workspace inside container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # The legacy `tools` package is gone and fails sdkmanager. Install the
          # API 36 platform this app compiles against, plus build-tools.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: wrapper

      - name: Determine version
        id: version
        run: |
          GRADLE_FILE=app/build.gradle.kts
          MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo "versionName=$VERSION_NAME"
            echo "shortSha=$SHORT_SHA"
            echo "tag=v${VERSION_NAME}-dev.${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK to consistent filename
        run: |
          mv app/build/outputs/apk/debug/*.apk \
             app/build/outputs/apk/debug/${{ env.APK_DEBUG }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "### Debug pre-release from \`develop\`"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.versionName }}"
            echo "- **Commit:** ${{ steps.version.outputs.shortSha }}"
            echo "- **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "## What's changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges | head -40
          } > "$GITHUB_WORKSPACE/release-changelog.md"
          cat "$GITHUB_WORKSPACE/release-changelog.md"

      - name: Post APK summary
        run: |
          APK_SIZE=$(du -sh app/build/outputs/apk/debug/${{ env.APK_DEBUG }} | cut -f1)
          {
            echo "### Debug APK"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File | \`${{ env.APK_DEBUG }}\` |"
            echo "| Size | ${APK_SIZE} |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DVIDE ${{ steps.version.outputs.versionName }} (dev)"
          body_path: ${{ github.workspace }}/release-changelog.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/debug/${{ env.APK_DEBUG }}

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  3 · PR SUMMARY                                                          │
  # │  Every PR into master. Re-runs checks, posts a detailed step summary +  │
  # │  a sticky PR comment with test/lint results and a changelog preview.    │
  # └─────────────────────────────────────────────────────────────────────────┘
  pr-summary:
    name: PR Summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17-jdk-jammy
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip curl git ca-certificates

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # checkout is a JavaScript action and runs on the host. Shell steps run
      # as root inside the job container, so git refuses the host-owned repo
      # until this config is set inside the container.
      - name: Trust git workspace inside container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # The legacy `tools` package is gone and fails sdkmanager. Install the
          # API 36 platform this app compiles against, plus build-tools.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Collect results
        id: results
        if: always()
        run: |
          TEST_COUNT=$(grep -ohr 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          FAIL_COUNT=$(grep -ohr 'failures="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "testCount=${TEST_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "failCount=${FAIL_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Changelog preview since last stable release
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            # tformat terminates each subject with a newline so CHANGELOG_EOF
            # stays on its own line. format: glues the delimiter onto the last commit.
            git log "$RANGE" --pretty=tformat:"- %s (%h)" --no-merges | head -30
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## PR Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Unit tests | ${{ steps.unit_tests.outcome == 'success' && '✅ passed' || '❌ failed' }} (${{ steps.results.outputs.failCount }}/${{ steps.results.outputs.testCount }} failing) |"
            echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅ passed' || '❌ failed' }} |"
            echo ""
            echo "### Changelog preview since last stable release"
            echo ""
            echo "${{ steps.changelog.outputs.changelog }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728
        with:
          header: pr-summary
          message: |
            ## CI Summary

            | Check | Result |
            |---|---|
            | Unit tests | ${{ steps.unit_tests.outcome == 'success' && '✅ passed' || '❌ failed' }} (${{ steps.results.outputs.failCount }}/${{ steps.results.outputs.testCount }} failing) |
            | Lint | ${{ steps.lint.outcome == 'success' && '✅ passed' || '❌ failed' }} |

            <details>
            <summary>Changelog preview since last stable release</summary>

            ${{ steps.changelog.outputs.changelog }}

            </details>

      - name: Fail job if checks failed
        if: steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: |
          echo "Unit tests or lint failed — see the PR comment / step summary above."
          exit 1

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  4 · STABLE RELEASE                                                      │
  # │  Push to master ONLY (single trigger — no separate tag trigger). Builds │
  # │  the merged commit itself (does not check out an older release branch). │
  # │  Signs via Gradle signingConfig when all four signing secrets are set.  │
  # │  Uploads app/build/outputs/bundle/release/dvide-release.aab to the Play  │
  # │  internal track when PLAY_CONSOLE_JSON is also set. packageName is the  │
  # │  applicationId. Missing Play credentials skip the upload.               │
  # └─────────────────────────────────────────────────────────────────────────┘
  stable-release:
    name: Stable Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17-jdk-jammy
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip curl git ca-certificates

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # checkout is a JavaScript action and runs on the host. Shell steps run
      # as root inside the job container, so git refuses the host-owned repo
      # until this config is set inside the container.
      - name: Trust git workspace inside container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # The legacy `tools` package is gone and fails sdkmanager. Install the
          # API 36 platform this app compiles against, plus build-tools.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: wrapper

      - name: Determine version
        id: version
        run: |
          GRADLE_FILE=app/build.gradle.kts
          MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [ -z "$BUILD" ]; then
            echo "::error::Could not parse major/minor/patch/build from $GRADLE_FILE"
            exit 1
          fi
          PACKAGE_NAME=$(sed -n 's/.*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$GRADLE_FILE" | head -1)
          if [ "$PACKAGE_NAME" != "$PLAY_PACKAGE_NAME" ]; then
            echo "::error::applicationId '${PACKAGE_NAME}' does not match PLAY_PACKAGE_NAME '${PLAY_PACKAGE_NAME}'."
            exit 1
          fi
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          # run_number is monotonic for this workflow, so every master merge
          # gets a Play versionCode even when the Gradle constants are unchanged.
          BASE_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD ))
          VERSION_CODE=$(( BASE_CODE + GITHUB_RUN_NUMBER ))
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "packageName=$PACKAGE_NAME"
            echo "shortSha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "**Version name:** $VERSION_NAME"
            echo ""
            echo "**Version code:** $VERSION_CODE (gradle $BASE_CODE + run $GITHUB_RUN_NUMBER)"
            echo ""
            echo "**Package:** \`$PACKAGE_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # `if:` cannot see a step's own env, and comparing secrets.* directly in
      # `if:` is unreliable. Resolve presence into outputs, then gate on those.
      - name: Resolve signing and Play credentials
        id: release_secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_CONSOLE_JSON: ${{ secrets.PLAY_CONSOLE_JSON }}
        run: sh .github/scripts/resolve-release-secrets.sh

      - name: Decode release keystore
        if: steps.release_secrets.outputs.signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Strip whitespace so a trailing newline in the secret does not
          # corrupt the keystore. Do not print the secret.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 did not decode to a keystore."
            exit 1
          fi

      # Single signing mechanism: STORE_FILE/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
      # are read by signingConfigs["release"] in app/build.gradle.kts.
      # Gradle attaches that config only when the keystore file exists.
      - name: Build release AAB + APK
        env:
          STORE_FILE:     ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.versionName }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}" \
            --stacktrace

      - name: Rename release artefacts
        id: artefacts
        run: |
          set -- app/build/outputs/apk/release/*.apk
          if [ ! -f "$1" ] || [ "$#" -ne 1 ]; then
            echo "::error::Expected exactly one release APK."
            ls -la app/build/outputs/apk/release >&2 || true
            exit 1
          fi
          mv "$1" "app/build/outputs/apk/release/${APK_RELEASE}"

          set -- app/build/outputs/bundle/release/*.aab
          if [ ! -f "$1" ] || [ "$#" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB."
            ls -la app/build/outputs/bundle/release >&2 || true
            exit 1
          fi
          mv "$1" "app/build/outputs/bundle/release/${AAB_RELEASE}"
          AAB="app/build/outputs/bundle/release/${AAB_RELEASE}"
          if [ ! -s "$AAB" ]; then
            echo "::error::Release AAB is missing or empty at ${AAB}"
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=app/build/outputs/apk/release/${APK_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Verify release AAB signature
        if: steps.release_secrets.outputs.signing == 'true'
        run: |
          AAB="${{ steps.artefacts.outputs.aab }}"
          # App bundles are JAR-signed. `jarsigner -verify` exits 0 for an
          # unsigned jar and prints "jar is unsigned", so match that string.
          VERIFY_OUT=$(jarsigner -verify "$AAB" 2>&1) || {
            printf '%s\n' "$VERIFY_OUT"
            echo "::error::Could not verify signature of ${AAB}"
            exit 1
          }
          printf '%s\n' "$VERIFY_OUT"
          if printf '%s\n' "$VERIFY_OUT" | grep -q "jar is unsigned"; then
            echo "::error::Release AAB is unsigned: ${AAB}"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "### Release Summary"
            echo "- **App:** dvide"
            echo "- **Package:** \`${{ steps.version.outputs.packageName }}\`"
            echo "- **Version:** v${{ steps.version.outputs.versionName }} (code ${{ steps.version.outputs.versionCode }})"
            echo "- **Commit:** ${{ steps.version.outputs.shortSha }}"
            echo "- **Rollback branch:** \`release/dvide/${{ steps.version.outputs.versionName }}.${{ github.run_number }}\`"
            echo ""
            echo "## What's changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges | head -40
          } > "$GITHUB_WORKSPACE/release-changelog.md"
          cat "$GITHUB_WORKSPACE/release-changelog.md"

      - name: Generate Play Store release notes
        if: steps.release_secrets.outputs.play == 'true'
        run: |
          mkdir -p release_notes
          # upload-google-play reads whatsnew-<locale> files in this directory.
          # Play rejects release notes longer than 500 characters.
          cat > release_notes/whatsnew-en-US <<EOF
          dvide ${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.shortSha }}).
          EOF

      - name: Post release summary
        run: |
          APK_SIZE=$(du -sh "app/build/outputs/apk/release/${APK_RELEASE}" | cut -f1)
          AAB_SIZE=$(du -sh "${{ steps.artefacts.outputs.aab }}" | cut -f1)
          if [ "${{ steps.release_secrets.outputs.play }}" = "true" ]; then
            PLAY="upload ${{ steps.artefacts.outputs.aab }} to ${PLAY_TRACK}"
          else
            PLAY="skipped (PLAY_CONSOLE_JSON unset)"
          fi
          {
            echo "| Artefact | Size |"
            echo "|---|---|"
            echo "| APK | ${APK_SIZE} |"
            echo "| AAB | ${AAB_SIZE} |"
            echo ""
            echo "| Play | Value |"
            echo "|---|---|"
            echo "| Package | \`${{ steps.version.outputs.packageName }}\` |"
            echo "| Track | \`${PLAY_TRACK}\` |"
            echo "| AAB path | \`${{ steps.artefacts.outputs.aab }}\` |"
            echo "| Upload | ${PLAY} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Play runs before the GitHub Release. Immutable releases reject assets
      # added after publish, and that failure must not skip the Play upload.
      - name: Publish to Google Play (internal track)
        if: steps.release_secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_JSON }}
          packageName: ${{ steps.version.outputs.packageName }}
          releaseFiles: ${{ steps.artefacts.outputs.aab }}
          track: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: release_notes
          releaseName: dvide-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.shortSha }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.versionName }}.${{ github.run_number }}
          name: "dvide v${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.versionCode }})"
          body_path: ${{ github.workspace }}/release-changelog.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.artefacts.outputs.apk }}
            ${{ steps.artefacts.outputs.aab }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Point a rollback branch at this master commit without checking it out,
      # so the AAB that was just built stays the merged commit.
      - name: Update rollback branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/dvide/${{ steps.version.outputs.versionName }}.${{ github.run_number }}"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Remove keystore
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/release.jks" ]; then
            shred -u "$GITHUB_WORKSPACE/release.jks" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/release.jks"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          fail-on-severity: high
