name: Play Console & GitHub Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Optional rollback version tag (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: play-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release, Publish GitHub & Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Extract Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            VERSION_NAME="${{ github.event.inputs.rollback_version }}"
            VERSION_CODE=$(date +'%Y%m%d%H')
          else
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
            VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          fi
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(date +'%Y.%m.%d')
            VERSION_CODE=$(date +'%Y%m%d')
          fi

          echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "shortSha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create Dedicated Release Branch
        run: |
          BRANCH_NAME="release/dvide/${{ steps.version.outputs.versionName }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Release branch $BRANCH_NAME exists, checking out."
            git checkout "$BRANCH_NAME"
          else
            echo "Creating dedicated release branch $BRANCH_NAME for safe rollback tracking."
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          fi

      - name: Build Android Release Artifacts (APK & AAB)
        env:
          STORE_FILE: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.versionName }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}" \
            --stacktrace

      - name: Generate Release Notes
        run: |
          mkdir -p release_notes/en-US
          cat > release_notes/en-US/default.txt <<EOF
          Source:
          branch=release/dvide/${{ steps.version.outputs.versionName }}
          commit=${{ github.sha }}
          workflow=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.versionName }}
          name: "DVIDE v${{ steps.version.outputs.versionName }}"
          body: |
            ### Release Summary
            - **App:** DVIDE
            - **Version:** v${{ steps.version.outputs.versionName }}
            - **Commit:** ${{ github.sha }}
            - **Release Branch:** `release/dvide/${{ steps.version.outputs.versionName }}`
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Google Play (Internal Track)
        if: env.PLAY_CONSOLE_JSON != ''
        env:
          PLAY_CONSOLE_JSON: ${{ secrets.PLAY_CONSOLE_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_JSON }}
          packageName: com.knownassurajit.dvide_finance.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: release_notes
          releaseName: dvide-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.shortSha }}
